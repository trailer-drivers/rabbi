<html lang="ar" dir="rtl">
<head>

<title>رَبّي | رفيق الأسرة</title>
<style>
:root{--bg:#f2f7f9;--sf:#ffffff;--tx:#12303a;--mu:#51696f;--ac:#0f6f7c;--ac2:#dcedf0;--sun:#f4b942;--sunbg:#fff3d6;--sunt:#6b4700;--bd:#d3e2e6;--wr:#fdecea;--wrt:#8a2a1f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a1e;--sf:#15262b;--tx:#e6f1f3;--mu:#9bb3b9;--ac:#5cc6d4;--ac2:#1b3840;--sunbg:#2d2512;--sunt:#f2cf86;--bd:#27414a;--wr:#331c19;--wrt:#f3b3aa;color-scheme:dark}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.8 "Segoe UI",Tahoma,"Noto Naskh Arabic","Geeza Pro",system-ui,sans-serif}

.st b{display:block;font-size:17px}
.st small{color:var(--mu)}
.back{font:inherit;background:none;border:0;color:var(--ac);padding:6px 0;cursor:pointer}
details{background:var(--sf);border:1px solid var(--bd);border-radius:12px;margin:0 0 10px;padding:0 14px}
summary{cursor:pointer;font-weight:700;padding:12px 0;list-style-position:inside}
details ul{margin:0 0 12px;padding-inline-start:20px}
li{margin:0 0 6px}
.why,.plan p{background:var(--ac2);border-radius:12px;padding:8px 12px;margin:0 0 10px;font-size:15px}
.plan p{background:none;padding:0;margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;background:var(--ac2);color:var(--tx);border:1.5px solid transparent;border-radius:99px;padding:6px 16px;cursor:pointer}
.chip.on{border-color:var(--ac);font-weight:700}
.plan{background:var(--ac2);border-radius:16px;padding:12px 16px;margin:12px 0}
.plan ol{margin:6px 0 0;padding-inline-start:22px}
.warn{background:var(--wr);color:var(--wrt);border-radius:16px;padding:12px 16px;margin:24px 0 12px}
.warn ul{margin:6px 0 0;padding-inline-start:20px}
.note{font-size:13.5px;color:var(--mu);margin:14px 0}
.fig{margin:6px 0 14px}
.sv{width:100%;height:auto;display:block;background:var(--sf);border:1px solid var(--bd);border-radius:12px}
.sv text{font:13px "Segoe UI",Tahoma,sans-serif;fill:var(--tx)}
.sv .m{fill:var(--mu);font-size:12px}
.sv .a{fill:var(--sun)}
.sv .c{fill:var(--ac)}
.sv .l{fill:none;stroke:var(--ac);stroke-width:2.5}
.sv .g{fill:var(--sf);stroke:var(--bd);stroke-width:1.5}
.sv .h{fill:var(--ac2);stroke:var(--ac);stroke-width:2}
.sv .ln{fill:none;stroke:var(--bd);stroke-width:3}
.fig figcaption{font-size:13.5px;color:var(--mu);margin-top:4px}
.kf,.kid,.tk{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin:8px 0}

.kf input{display:block;width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;margin-top:4px}
.go{font:inherit;background:var(--ac);color:var(--bg);border:0;border-radius:99px;padding:8px 24px;cursor:pointer;margin-top:6px}
.bar{height:10px;background:var(--ac2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.ck{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
.ck input{margin-top:7px;width:18px;height:18px;accent-color:var(--ac)}
.qs{display:block;width:100%;font:inherit;color:var(--tx);background:var(--sf);border:1.5px solid var(--bd);border-radius:12px;padding:10px;margin:8px 0}
.res{display:block;width:100%;text-align:right;font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;margin:6px 0;cursor:pointer}
.res small{color:var(--mu)}
.br{width:90px;height:90px;border-radius:50%;background:var(--ac2);border:3px solid var(--ac);margin:16px auto;animation:b 10s ease-in-out infinite}
@keyframes b{0%,100%{transform:scale(.7)}40%{transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){.br{animation:none}}
</style>
</head>

D.us=[D.u,
{secs:[
['🌱','ماذا يحدث في نموه؟',['يتسع خياله ويحب اللعب التخيّلي وكثرة الأسئلة: «لماذا؟».','يتحسن كلامه، ويبدأ بفهم مشاعر غيره تدريجيًا.','يريد المبادرة والاستقلال: «أنا أستطيع».','مخاوف الظلام والوحوش طبيعية بسبب نشاط خياله.','ما زال يحتاج مساعدتك لتنظيم مشاعره.'],'الفكرة العلمية: اللعب هو الوسيلة الأساسية للتعلّم في هذا العمر، وفيه يبني الطفل لغته وتفكيره وقدرته على الانتظار.',PLAY],
['💛','ما احتياجاته النفسية؟',['حب وأمان لا يتوقفان على سلوكه.','فرصة للمبادرة والتجربة وارتكاب أخطاء صغيرة.','لعب حر وخيال.','قواعد ثابتة وواضحة يفهمها.','أصدقاء يتعلّم معهم المشاركة والتعاون.'],'الفكرة العلمية: وصف إريكسون هذه المرحلة بـ«المبادرة مقابل الشعور بالذنب»: الطفل الذي يُشجَّع على المحاولة يكبر واثقًا، والذي يُوبَّخ كثيرًا قد يتجنّب التجربة خوفًا من الخطأ.'],
['✅','ماذا أفعل؟',['العب معه ١٠–٢٠ دقيقة يوميًا ودعه يقود اللعب.','أجب عن أسئلته بصبر وبكلمات بسيطة.','كلّفه بمهام صغيرة: ترتيب لعبته، وضع الملعقة.','سمِّ مشاعره ثم اسأله: «ماذا نفعل الآن؟»','ضع قواعد قليلة ثابتة وعواقب منطقية هادئة: «إن رميت اللعبة نضعها جانبًا».','اقرأ له كل يوم، وحدّد الشاشات بساعة كحدّ أقصى مع مشاهدتها معه.'],'لماذا تنجح؟ اللعب الذي يقوده الطفل يقوّي العلاقة، والعاقبة الهادئة المتوقعة تعلّمه الربط بين تصرفه ونتيجته، والمديح الفوري يقوّي السلوك الجيد أكثر من العقاب.',EMO],
['🚫','ماذا أتجنّب؟',['الضرب والصراخ والسخرية.','التهديد بأمور مخيفة: «سيأخذك الوحش».','الحماية الزائدة؛ دعه يجرّب ويخطئ بأمان.','مقارنته بغيره.'],'لماذا؟ التهديد بالمخيف يزيد مخاوفه، والعقاب القاسي يعلّمه إخفاء أخطائه لا إصلاحها.',F.q],
['🗣️','قل ولا تقل',['بدل «لا تبكِ» قل: «أراك حزينًا، هل تريد أن نتحدث؟»','بدل «أنت أناني» قل: «أخوك يريد أن يلعب أيضًا، فلنتبادل الأدوار».','بدل «أنت ذكي» قل: «أعجبني أنك لم تستسلم».','بدل «أنت بطيء» قل: «سنخرج بعد خمس دقائق، ما الذي تبقى؟»','بدل «سأعاقبك» قل: «سنتحدث عمّا حدث ونصلحه معًا».'],'لماذا؟ وصف المطلوب بدل نقد شخص الطفل يحمي تقديره لذاته ويوضّح له ما عليه فعله، ومدح الجهد يشجّع المثابرة أكثر من مدح الذكاء.'],
['📅','يوم تقريبي يحقق الاستقرار',['صباحًا: استيقاظ وإفطار، ويلبس ما يستطيع بنفسه.','لعب حر ونشاط في الهواء الطلق.','بعد الغداء: راحة أو قيلولة قصيرة إن احتاجها.','عصرًا: لعب خيالي أو نشاط فني معك.','مساءً: عشاء مع العائلة، ثم حمام وقصة ونوم.'],'لماذا؟ الروتين المتوقع يمنحه الأمان ويقلّل المقاومة، وهو يحتاج إلى نحو ١٠–١٣ ساعة نوم يوميًا في هذا العمر.']],
probs:[
['العناد ورفض الأوامر',['أعطه اختيارين بدل الأمر.','قل ما تريده بصيغة إيجابية قصيرة: «نمشي بهدوء».','نبّهه قبل الانتهاء: «بعد ٥ دقائق نرتّب».','نفّذ العاقبة المنطقية بهدوء دون صراخ.','امدح تعاونه فور حدوثه.'],'التفسير: العناد في هذا العمر بحث عن الاستقلال لا تحدٍّ لك، والتنبيه المسبق والاختيارات يقلّلان الصدام.',CONS],
['الكذب',['فرّق بين الخيال واللعب والكذب الحقيقي.','لا تحقّق معه كمحقّق؛ قل: «رأيت أن الكوب انكسر. لننظّفه معًا».','كافئ الصدق ولا تعاقب بشدة على الاعتراف.','كن قدوة في الصدق.'],'التفسير: يخلط الطفل الخيال بالواقع، وكثيرًا ما يكذب خوفًا من العقاب؛ فالعقاب الشديد يزيد الكذب.'],
['الخوف من الظلام',['صدّق شعوره ولا تسخر منه.','لا تجبره على مواجهة ما يخيفه.','استخدم ضوءًا خافتًا.','علّمه تنفّسًا هادئًا: «شمّ الوردة ثم اطفئ الشمعة».','قرّبه من مخاوفه بخطوات صغيرة.'],'التفسير: الخيال النشط يجعل المخاوف حقيقية بالنسبة له، وهي طبيعية وتخفّ بالطمأنينة والتدرّج.'],
['الغيرة من أخ أو أخت',['خصّص له وقتًا خاصًا يوميًا ولو ١٠ دقائق.','سمِّ شعوره: «تشعر بالغيرة لأنك تريد اهتمامي».','أشركه في رعاية الصغير كمساعد.','لا تقارن بينهما ولا تتحيّز.','اسمح له بالاحتفاظ ببعض ألعابه الخاصة.'],'التفسير: الغيرة خوف من فقدان مكانته عندك وليست كراهية، والوقت الخاص يطمئنه أنك ما زلت له.'],
['الضرب والعدوانية',['تدخّل فورًا وأوقف السلوك بهدوء وحزم: «لا نضرب، الضرب يؤلم».','اعتنِ بالطفل المصاب أولًا.','بعد أن يهدأ علّمه بديلًا: يقول «توقف» أو يطلب مساعدتك.','راقب ما يراه من مشاهد عنف على الشاشات.','امدح اللعب الهادئ والتعاون حين يحدث.'],'التفسير: ضبط الاندفاع ما زال ينضج في هذا العمر، والطفل يقلّد ما يراه، فيحتاج إلى نموذج هادئ وبدائل واضحة.'],
['الكوابيس ورفض النوم',['ثبّت روتينًا هادئًا قبل النوم.','بعد الكابوس احتضنه وقل: «أنت بأمان».','لا تناقش تفاصيله ليلًا، واتركها للنهار.','ضوء خافت وغرفة مطمئنة.','قلّل المحتوى المخيف في الشاشات.'],'التفسير: الكوابيس شائعة في هذا العمر بسبب نشاط الخيال، وتقلّ مع الوقت والطمأنينة.']],
flags:['لا يكوّن جملًا قصيرة بحلول ٣ سنوات.','لا يلعب مع الآخرين أو لا يلعب لعبًا تخيليًا.','فقد مهارة كان يجيدها.','عدوانية شديدة ومستمرة تؤذيه أو تؤذي غيره.','خوف أو قلق شديد يعطّل حياته اليومية.','صعوبة شديدة في فهم التعليمات البسيطة أو تأخر واضح في أكثر من جانب من النمو.','نوم مضطرب جدًا أو كوابيس مرعبة متكررة تؤثر على يومه.'],src:SRC},
{secs:[
['🌱','ماذا يحدث في نموه؟',['يدخل المدرسة ويتعلّم القواعد ومعنى العدل.','تصبح الصداقات مهمة جدًا.','يقارن نفسه بغيره ويتأثر بنجاحه وفشله.','يفكّر بمنطق في الأشياء الملموسة، ويطول انتباهه.'],'الفكرة العلمية: يبني الطفل في هذا العمر صورته عن نفسه من إنجازاته ومن تعليقات من حوله، وتشير الأبحاث إلى أن مدح الجهد والمحاولة يشجّع المثابرة.',DAY],
['💛','ما احتياجاته النفسية؟',['شعور بالكفاءة والإنجاز في المدرسة والبيت.','حب وقبول لا يرتبطان بالنتائج.','صداقات وانتماء لمجموعة.','استقلال متدرج ومسؤوليات مناسبة.','وقت منتظم معك للحديث واللعب.'],'الفكرة العلمية: وصف إريكسون هذه المرحلة بـ«الاجتهاد مقابل الشعور بالنقص»: حين ينجح الطفل في مهامه ويُشجَّع يشعر بالكفاءة، وحين يتكرر فشله دون دعم قد يشعر بأنه أقل من غيره.'],
['✅','ماذا أفعل؟',['خصّص وقتًا يوميًا ليحكي لك عن يومه.','ثبّت مكانًا وموعدًا للواجب، واجلس قريبًا دون أن تحلّه عنه.','امدح جهده وطريقته: «أعجبني أنك لم تستسلم».','أعطه مسؤوليات منزلية مناسبة.','شجّع حركة ساعة يوميًا على الأقل.','اتفقوا كأسرة على قواعد الشاشات، وأبعدها عن غرفة النوم ليلًا.'],'لماذا تنجح؟ الروتين الثابت يخفف التوتر، والمسؤوليات تبني الكفاءة، والاتفاق المسبق يقلّل الجدال حول الشاشات.',GROW],
['🚫','ماذا أتجنّب؟',['ربط حبّك له بدرجاته.','المقارنة بإخوته أو زملائه.','حلّ الواجب بدلًا منه.','السخرية من أخطائه.'],'لماذا؟ الطفل الذي يشعر أن قيمته مرتبطة بالنتائج يخاف من الخطأ ويتجنّب المحاولة.'],
['🗣️','قل ولا تقل',['بدل «لماذا درجتك ناقصة؟» قل: «حدّثني عن الاختبار، ما الذي كان صعبًا؟»','بدل «أخوك أفضل منك» قل: «لاحظت أنك تحسّنت في هذا».','بدل «لا تكن ضعيفًا» قل: «من الطبيعي أن تتضايق، ماذا تريد أن تفعل؟»','بدل «سأحلّها أنا» قل: «ما الخطوة الأولى برأيك؟»','بدل «أنت دائمًا تنسى» قل: «ما الذي يساعدك على التذكّر؟»'],'لماذا؟ الأسئلة المفتوحة تدفعه إلى التفكير وتبني استقلاله، ووصف المشكلة بدل اتهام الطفل يحميه من الشعور بالنقص.'],
['📅','يوم تقريبي يحقق الاستقرار',['صباحًا: استيقاظ بوقت كافٍ لإفطار هادئ.','بعد المدرسة: وجبة وراحة ثم لعب أو حركة.','الواجب في مكان وموعد ثابتين.','مساءً: عشاء مع الأسرة وحديث عن اليوم.','إغلاق الشاشات قبل النوم بساعة، ثم قراءة قصيرة.'],'لماذا؟ الروتين يقلّل الصراع اليومي، ويحتاج الطفل في هذا العمر إلى نحو ٩–١٢ ساعة نوم ليتركّز ويضبط انفعالاته.']],
probs:[
['رفض الواجب',['اسأله عن السبب: صعوبة؟ ملل؟ تعب؟ قلق؟','ثبّت مكانًا وموعدًا مناسبين.','قسّم الواجب إلى فترات قصيرة بينها راحة.','ابقَ قريبًا للمساعدة دون أن تحلّ عنه.','تواصل مع المعلّمة إن استمرت الصعوبة.'],'التفسير: رفض الواجب يخفي غالبًا صعوبة أو إحباطًا أو تعبًا، وليس كسلًا.',HW],
['التنمّر والخلافات',['استمع دون مقاطعة وصدّق شعوره.','لا تعده بالانتقام.','ساعده على التفكير في حلول: يقول «توقف»، يبتعد، يطلب مساعدة معلّم.','تواصل مع المدرسة إذا تكرر الأمر.','عزّز صداقاته الجيدة.'],'التفسير: الدعم المستمر من الأسرة من أهم ما يحمي الطفل من آثار التنمّر.',BUL],
['الخوف من الفشل',['امدح المحاولة لا النتيجة.','شاركه أخطاءك وكيف تعلّمت منها.','قسّم المهمة الكبيرة إلى خطوات صغيرة.','لا تقارنه بغيره.'],'التفسير: من يخاف الخطأ يتجنّب المحاولة، فيفوّت فرص التعلّم.'],
['الكذب',['ابقَ هادئًا واسأل عن السبب دون أسئلة فخ.','ركّز على الإصلاح لا على العقاب.','كافئ الصدق: «شكرًا لأنك أخبرتني».','كن قدوة في الصدق.'],'التفسير: يعرف الطفل في هذا العمر أنه يكذب، وغالبًا يفعل ذلك خوفًا من العقاب، فالعقاب الشديد يزيد الإخفاء.'],
['الإفراط في الشاشات والألعاب',['اتفقوا كأسرة على أوقات واضحة للشاشات.','أبعد الأجهزة عن غرفة النوم ليلًا.','اعرف ما يلعبه ويشاهده وشاركه أحيانًا.','وفّر بدائل ممتعة: رياضة وهوايات.','كن قدوة في استخدامك.'],'التفسير: الألعاب والتطبيقات مصمَّمة لجذب الانتباه، وتوصي الأكاديمية الأمريكية لطب الأطفال بخطة أسرية لاستخدام الشاشات.'],
['نوبات الغضب والانفعال',['علّمه علامات جسمه عند الغضب: قلب يخفق، وجه ساخن.','درّبه على التنفس البطيء: شهيق ثم زفير طويل.','اتفقا على مكان هادئ يذهب إليه.','تحدثا بعد أن يهدأ عمّا حدث.','امدح كل مرة يهدأ فيها بنفسه.'],'التفسير: ضبط الغضب مهارة تنمو بالتدريب، والتنفس البطيء يساعد الجسم على الهدوء.']],
flags:['صعوبة مستمرة في القراءة أو الكتابة أو الانتباه رغم المساعدة.','تغيّر واضح ومستمر في المزاج أو النوم أو الأكل.','رفض متكرر للذهاب إلى المدرسة مع آلام جسدية.','تعرّضه لتنمّر مستمر أو إيذاء.','فقدان الاهتمام بما كان يحبه لفترة طويلة.','نوبات غضب شديدة أو عنف متكرر.','يقول إنه يريد إيذاء نفسه أو لا يريد أن يعيش: اطلب مساعدة مختص فورًا.'],src:SRC},
{secs:[
['🌱','ماذا يحدث في نموه؟',['قد يبدأ البلوغ عند بعضهم، والتوقيت يختلف من طفل لآخر.','يتقلّب مزاجه، ويحتاج إلى خصوصية واستقلال أكبر.','يزداد تأثير الأصدقاء، ويهتم بمظهره.','تبدأ ضغوط الدراسة واستخدام الإنترنت.'],'الفكرة العلمية: في بداية المراهقة يمرّ الدماغ بإعادة بناء كبيرة، فيصبح أكثر حساسية للأقران والمكافآت قبل أن يكتمل نضج التحكم.',LIS],
['💛','ما احتياجاته النفسية؟',['أمان وحب ثابت حتى حين يتصرف بغير ما تحب.','خصوصية واستقلال متدرّج.','انتماء إلى أصدقاء وجماعة.','معلومات صادقة عن جسده وتغيّراته.','قدوة ونقاش حقيقي حول القيم.'],'الفكرة العلمية: تشير أبحاث المراهقة إلى أن علاقة دافئة مع الأهل مع حدود واضحة (التربية الحازمة الدافئة) ترتبط بأفضل النتائج النفسية والدراسية.'],
['✅','ماذا أفعل؟',['حدّثه قبل البلوغ عن تغيّرات جسده بصدق وبساطة.','استمع أكثر مما تعظ.','أعطه قرارات صغيرة مع حدود واضحة.','اعرف أصدقاءه وأين يكون.','اتفقوا على قواعد الشاشات، وتحدّث معه عن الأمان على الإنترنت.','خصّص له وقتًا فرديًا معك.'],'لماذا تنجح؟ الاستقلال المتدرّج يلبّي حاجته للنضج، والحوار المفتوح يجعله يلجأ إليك حين يواجه مشكلة.',STEP],
['🚫','ماذا أتجنّب؟',['إحراجه أمام الآخرين.','السخرية من تغيّرات جسده.','التجسّس والتحقيق المفرط.','العقاب الشديد على الأخطاء الصغيرة.','التقليل من مشاعره: «لا شيء يستحق».'],'لماذا؟ الإحراج والتجسّس يدفعانه للإخفاء بدل أن يطلب مساعدتك.'],
['🗣️','قل ولا تقل',['بدل «ما هذا الهراء!» قل: «أخبرني برأيك، أريد أن أفهم».','بدل «لا تكلمني هكذا» قل: «أسمعك حين نتحدث بهدوء، فلنؤجّل النقاش عشر دقائق».','بدل «أنت كسول» قل: «لاحظت أن المذاكرة صعبة عليك هذه الأيام، ما الذي يعيقك؟»','بدل «لا شيء يستحق البكاء» قل: «يبدو أن الأمر أحزنك، أنا هنا إن أردت الكلام».','بدل «سأحرمك من كل شيء» قل: «اتفقنا على القاعدة، ونتيجة مخالفتها هي ما اتفقنا عليه».'],'لماذا؟ الاستماع والاحترام يُبقيان باب الحوار مفتوحًا، والمراهق يلتزم أكثر بما شارك في تحديده.'],
['📅','يوم تقريبي يحقق الاستقرار',['صباحًا: استيقاظ في موعد ثابت وإفطار.','بعد المدرسة: راحة ثم واجب بتنظيم يضعه بنفسه مع متابعتك.','حركة أو رياضة يوميًا.','عشاء أسري دون هواتف وحديث عن اليوم.','الأجهزة خارج غرفة النوم ليلًا، ونوم نحو ٩–١٢ ساعة.'],'لماذا؟ ترتبط الوجبات الأسرية المنتظمة بنتائج نفسية أفضل، والنوم الكافي يحسّن التركيز والمزاج.']],
probs:[
['العناد والجدال',['اهدأ ولا تدخل في صراع قوة.','استمع لرأيه ثم أعلن قرارك بوضوح.','ضع قواعد قليلة ومهمة وأشركه في وضعها.','اجعل العواقب معروفة مسبقًا.','اختر معاركك.'],'التفسير: الجدال جزء من بحثه عن الاستقلال، ومشاركته في وضع القواعد تزيد التزامه بها.'],
['الإفراط في الشاشات',['اتفاق أسري بأوقات واضحة.','أجهزة خارج غرفة النوم ليلًا.','اعرف ما يلعبه ويشاهده.','وفّر بدائل ممتعة: رياضة، هوايات.','كن قدوة في استخدامك.'],'التفسير: الألعاب والتطبيقات مصمَّمة لجذب الانتباه، لذلك يحتاج إلى حدود وليس إلى الوعظ فقط.',SCR],
['تقلّب المزاج والانعزال',['اجلس معه دون ضغط: «لاحظت أنك هادئ».','استمع وصدّق مشاعره.','حافظ على روتين النوم والحركة.','شجّعه على الأنشطة والصداقات.','اطلب مساعدة مختص إن استمر الحزن أسبوعين أو أكثر.'],'التفسير: تقلّب المزاج وارد مع البلوغ، لكن الحزن المستمر قد يكون علامة تحتاج إلى مختص.',MOOD],
['ضغط الأصدقاء',['اعرف أصدقاءه ورحّب بهم في البيت.','تدرّب معه على قول «لا» في مواقف قد يتعرض لها.','اتفقا على كلمة سرّية يطلب بها مساعدتك دون إحراج.','لا تنتقد أصدقاءه بقسوة.','ابقَ متاحًا ليحكي لك.'],'التفسير: يزداد تأثير الأقران في بداية المراهقة، ومن تدرّب على الرفض يقاوم الضغط أسهل.'],
['تراجع الدراسة',['اسأله عن السبب بفضول دون لوم.','تأكد من النوم والصحة والضغوط: تنمّر؟ قلق؟ صعوبة؟','ساعده على تنظيم وقته.','تواصل مع المدرسة.','كافئ التحسّن مهما كان صغيرًا.'],'التفسير: التراجع المفاجئ غالبًا إشارة إلى مشكلة كالتعب أو القلق أو التنمّر، وليس قلة اهتمام فقط.'],
['الأمان على الإنترنت',['تحدّث معه عن الخصوصية: لا يشارك صورًا أو معلومات شخصية.','تعرّف على التطبيقات التي يستخدمها.','اتفقا على أن يخبرك إن طلب منه غريب شيئًا أو أزعجه أحد، دون عقاب.','فعّل إعدادات الخصوصية.','علّمه ألا يرد على الغرباء.'],'التفسير: الخطر الأكبر هو صمت الطفل خوفًا من العقاب، فالثقة والتواصل أهم من المنع وحده.']],
flags:['حزن أو انعزال لأسبوعين أو أكثر.','تراجع دراسي مفاجئ.','تغيّر كبير في النوم أو الأكل.','تنمّر أو ابتزاز عبر الإنترنت.','صعوبة مستمرة في التركيز أو مزاج متدنٍّ يؤثر على دراسته وصداقاته.','تدخين أو استخدام مواد ممنوعة.','يؤذي نفسه أو يتحدث عن الموت: اطلب مساعدة مختص فورًا.'],src:SRC}];
const SAFE=fg(110,B(222,10,88,90,'h')+B(116,10,88,90,'g')+B(10,10,88,90,'g')+T(266,34,'وحده')+T(266,58,'سرير خالٍ','m')+T(266,76,'من الأشياء','m')+T(160,34,'على ظهره')+T(160,58,'عند كل','m')+T(160,76,'نومة','m')+T(54,34,'سطح ثابت')+T(54,58,'مسطّح','m')+T(54,76,'وآمن','m'),'قاعدة النوم الآمن: وحده، على ظهره، على سطح ثابت ومسطّح. والأفضل أن يكون سريره في غرفتك.');
const TLI=fg(125,`<path class='ln' d='M20 62H300'/>`+[270,215,160,110,60].map(x=>`<circle class='c' cx='${x}' cy='62' r='5'/>`).join('')+T(270,22,'يبتسم لك')+T(270,42,'شهران','m')+T(215,86,'٤ أشهر','m')+T(215,106,'يصدر أصواتًا')+T(160,22,'يستجيب لاسمه')+T(160,42,'٦ أشهر','m')+T(110,86,'٩ أشهر','m')+T(110,106,'يبحث عمّا سقط')+T(60,22,'يلوّح ويقول «ماما»')+T(60,42,'١٢ شهرًا','m'),'معالم تقريبية؛ لكل رضيع وتيرته، وإن تأخّر معلم فاستشر طبيب الأطفال.');
D.us[4]={secs:[
['🌱','ماذا يحدث في نموه؟',['ينام كثيرًا ويستيقظ للرضاعة على فترات متقاربة.','يتعرّف على صوتك ووجهك تدريجيًا، ويبدأ الابتسام الاجتماعي قرابة الشهر الثاني.','يتعلّم بالنظر واللمس ووضع الأشياء في فمه.','يبدأ بالمناغاة ثم الثرثرة، ثم الجلوس والزحف خلال السنة الأولى.','البكاء هو لغته الوحيدة في البداية، وليس «دلعًا».'],'الفكرة العلمية: دماغ الرضيع يتشكّل بالتفاعل، فكل مرة تحمله وتكلّمه وتستجيب لبكائه تبني أساس الأمان العاطفي. ولا تُفسده كثرة حمله وطمأنته كما يُشاع.',TLI],
['💛','ما احتياجاته؟',['حليب عند الجوع دون جدول صارم.','نوم آمن.','حضن ودفء وقرب منك.','استجابة سريعة وهادئة لبكائه.','كلام وغناء ونظر في عينيه.'],'الفكرة العلمية: الرضيع لا يستطيع تهدئة نفسه، فيتعلّم تنظيم مشاعره من استجابتك المتكررة، وهذا ما يسمّيه العلماء «التنظيم المشترك».'],
['✅','ماذا أفعل؟',['ضعه على ظهره عند كل نوم، على سطح ثابت ومسطّح وفي سريره وحده بلا وسائد أو ألعاب أو بطانيات.','أرضعه عند ظهور علامات الجوع؛ وتوصي منظمة الصحة العالمية بالرضاعة الطبيعية الحصرية في أول ستة أشهر.','تحدّث معه وغنِّ له وانظر في عينيه عدة مرات يوميًا.','ضعه على بطنه وهو مستيقظ وتحت إشرافك لفترات قصيرة يوميًا (وقت البطن).','احمله وطمئنه عند البكاء، فالرضيع لا «يتدلّع».','التزم بمواعيد التطعيمات حسب جدول وزارة الصحة في بلدك.','اقرأ له كتبًا بسيطة بالصور منذ الأشهر الأولى.'],'لماذا؟ الاستجابة المتكررة تبني الأمان، والنوم الآمن يقلّل خطر متلازمة موت الرضيع المفاجئ (SIDS)، ووقت البطن يقوّي عضلات الرقبة والكتفين.',SAFE],
['🚫','ماذا أتجنّب؟',['هزّ الرضيع بعنف مهما اشتد بكاؤه؛ إن شعرت بالغضب ضعه في سريره الآمن وابتعد دقائق.','النوم معه على أريكة أو كنبة، أو وضع الوسائد والألعاب في سريره.','التدخين حوله أو في البيت.','إعطاؤه عسلًا قبل إتمام السنة، أو أدوية أو أعشابًا دون استشارة الطبيب.','تركه وحده على سطح مرتفع أو في الحمام أو السيارة ولو لحظات.','الشاشات: لا توصي الأكاديمية الأمريكية لطب الأطفال بها لمن دون ١٨ شهرًا عدا مكالمات الفيديو.'],'لماذا؟ هذه الأمور مرتبطة بإصابات وحوادث خطيرة يمكن تجنّبها عند الرضّع.'],
['🗣️','كيف أتواصل معه؟',['سمِّ ما تفعله: «الآن نغيّر الحفاضة».','قلّد أصواته وانتظر ردّه كأنها محادثة.','غنِّ له الأغنية نفسها يوميًا.','أشِر إلى الأشياء وسمّها.','قل له «أنا هنا» حين يبكي.'],'لماذا؟ تنمو اللغة من الكلام الموجّه إليه ومن المحادثة المتبادلة، لا من التلفاز في الخلفية.'],
['📅','يوم تقريبي يحقق الاستقرار',['رضاعة عند الجوع مع وقت قصير من التواصل بعدها.','فترات يقظة قصيرة تتخلّلها قيلولات متعددة.','وقت بطن وحديث وغناء أثناء اليقظة.','روتين بسيط قبل النوم: حمام دافئ، تدليك لطيف، أغنية.','أنهِ اليوم بهدوء وإضاءة خافتة.'],'لماذا؟ التكرار يعطي الرضيع إشارات تدلّ على قرب النوم. وتختلف ساعات النوم كثيرًا بين الرضّع، وتوصي الأكاديمية الأمريكية لطب الأطفال بنحو ١٢–١٦ ساعة يوميًا بين ٤ و١٢ شهرًا بما فيها القيلولات.']],
probs:[
['بكاء الرضيع',['افحص الأسباب: جوع، حفاضة، غازات، برودة أو حرارة، تعب.','احمله وهدّئه: لفّه بخفة، همهمة، حركة لطيفة، صوت هادئ.','قد يبكي أحيانًا بلا سبب واضح، خاصة في المساء، وهذا لا يعني أنك مقصّر.','إن شعرت بالإرهاق ضعه في سريره الآمن وخذ استراحة قصيرة.','لا تهزّه أبدًا.'],'التفسير: يبلغ البكاء ذروته غالبًا حول الأسبوع السادس ثم يقلّ، وهو وسيلته للتواصل. وإن صاحبه حمّى أو قيء أو رفض للرضاعة فاتصل بالطبيب.'],
['صعوبات النوم',['ضعه في سريره وهو ناعس لا نائم ليتعلّم النوم تدريجيًا.','ثبّت روتينًا هادئًا قبل النوم.','غرفة هادئة وخافتة.','اجعل سريره المنفصل في غرفتك في الأشهر الستة الأولى على الأقل، وهذا ما تنصح به الأكاديمية الأمريكية لطب الأطفال.','تقبّل أن استيقاظه ليلًا طبيعي في الأشهر الأولى.'],'التفسير: دورات نوم الرضيع قصيرة وتنضج تدريجيًا، لذلك يستيقظ كثيرًا في الأشهر الأولى.'],
['التسنين',['دلّك لثته بإصبع نظيفة.','قدّم حلقة تسنين باردة (ليست مجمّدة).','امسح اللعاب لتجنّب الطفح.','لا تستخدم جلات مخدّرة ولا قلادات تسنين.','استشر الطبيب إن ظهرت حمّى مرتفعة.'],'التفسير: التسنين يسبب انزعاجًا وسيلانًا للعاب، لكنه لا يسبب حمّى مرتفعة، فلا تفسّر هذه الأعراض بالتسنين وحده.'],
['بداية الطعام (بعد ٦ أشهر)',['ابدأ بعد إتمام ستة أشهر وعند ظهور علامات الاستعداد: يجلس بدعم ويتحكم برأسه ويهتم بالطعام.','قدّم أطعمة طرية أو مهروسة أو بقطع آمنة، صنفًا صنفًا.','استمر بالرضاعة بجانب الطعام.','تجنّب ما يسبب الاختناق: عنب كامل، مكسرات، فشار.','لا ملح ولا سكر مضاف، ولا عسل قبل سنة.','اسأل طبيبك عن توقيت إدخال الأطعمة المسبّبة للحساسية.'],'التفسير: بعد ستة أشهر يحتاج الرضيع إلى أغذية تكميلية لتغطية احتياجاته، ويتعلّم تقبّل الطعم والقوام بالتكرار.']],
flags:['طوارئ: حرارة ٣٨°م أو أكثر عند رضيع أقل من ٣ أشهر.','طوارئ: صعوبة في التنفس أو لون أزرق أو شاحب أو أنين.','خمول شديد أو صعوبة في إيقاظه.','يرفض الرضاعة لعدة وجبات أو يقيء بغزارة أو براز دموي.','لا يبتسم لك بحلول ٣ أشهر.','لا يثرثر أو لا يبدي اهتمامًا بالأصوات بحلول ٩ أشهر، أو فقد مهارة اكتسبها.'],src:SRC};
const $=s=>document.querySelector(s),app=$("#app"),L=a=>a.map(x=>`<li>${x}</li>`).join("");
function home(){
const t=D.tips[Math.floor(Date.now()/864e5)%D.tips.length];
app.innerHTML=`<span class="b">نسخة أولية قيد المراجعة</span><h1>رَبّي</h1><p class="sub">رفيق الأسرة في رحلة تربية الأبناء</p>${kidsUI()}<div id="td">${todayUI()}</div>${toolsUI()}
<div class="tip"><b>نصيحة اليوم</b><p>${t}</p></div>
<h2>اختر عمر طفلك</h2>
${[4,0,1,2,3].map(i=>{const s=D.stages[i];return `<button class="st" ${s[2]?`onclick="stage(${i})"`:"disabled"}><span class="n">${s[0]}</span><span><b>${s[1]}</b><small>${s[2]?"متاح الآن":"قريبًا"}</small></span></button>`}).join("")}
<p class="note">${D.note}</p>`;
scrollTo(0,0)}
let cur=0;
function stage(k){
cur=k;const u=D.us[k];
app.innerHTML=`<button class="back" onclick="home()">→ رجوع</button><h2 style="margin-top:4px">${D.stages[k][1]}</h2>
${u.secs.map((s,i)=>`<details ${i?"":"open"}><summary>${s[0]} ${s[1]}</summary>${s[3]?`<p class="why">${s[3]}</p>`:""}${(cur?s[4]:FS[i])||''}<ul>${L(s[2])}</ul></details>`).join("")}
<h3>مشكلة تواجهك؟</h3>
<div class="chips">${u.probs.map((p,i)=>`<button class="chip" onclick="prob(${i})">${p[0]}</button>`).join("")}</div>
<div id="plan"></div>
<div class="warn"><b>متى أستشير طبيب الأطفال أو أخصائيًا؟</b>${cur?'':F.tl}<ul>${L(u.flags)}</ul></div>
<p class="note">${u.src}</p><p class="note">آخر تحديث للمحتوى: ٢٣ نوفمبر ٢٠٢٦ · الحالة: مسودة لم تُراجَع بعد من مختص.</p><p class="note">${D.note}</p>`;
scrollTo(0,0)}
function prob(i){
const p=D.us[cur].probs[i];
$("#plan").innerHTML=`<div class="plan"><b>خطة: ${p[0]}</b> <button class="back" onclick="fv('${cur}|${i}')">${S.fav.includes(cur+'|'+i)?'★ محفوظة':'☆ احفظ'}</button>${p[2]?`<p>${p[2]}</p>`:""}${(cur?p[3]:FP[i])||''}<ol>${L(p[1])}</ol></div>`;
document.querySelectorAll(".chip").forEach((c,j)=>c.classList.toggle("on",j==i))}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'),AR=n=>n.toLocaleString('ar-EG');
const KEY='rabbi.v1';let S={kids:[],cur:null,done:{},fav:[]};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const dk=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const curKid=()=>S.kids.find(x=>x.id==S.cur);
function ageOf(b){b=new Date(b);const n=new Date();let m=(n.getFullYear()-b.getFullYear())*12+n.getMonth()-b.getMonth();if(n.getDate()<b.getDate())m--;return m}
const stageOf=m=>m<12?4:m<36?0:m<72?1:m<108?2:m<156?3:-2;
const ageTxt=m=>m<12?AR(m)+' شهرًا':AR(Math.floor(m/12))+' سنة'+(m%12?' و'+AR(m%12)+' شهرًا':'');
function kidsUI(){
window.dq=0;
const k=curKid(),chips=S.kids.map(x=>`<button class='chip${x.id==S.cur?' on':''}' data-id='${x.id}' onclick='pick(this.dataset.id)'>${esc(x.name)}</button>`).join('');
let info='';
if(k){const m=ageOf(k.dob),s=stageOf(m);
info=`<div class='kid'><b>${esc(k.name)}</b> · ${ageTxt(m)}<br>`+(s>=0?`المرحلة: ${D.stages[s][1]}<br><button class='back' onclick='stage(${s})'>افتح المرحلة ←</button>`:(s==-1?'مرحلة الرضّع (أقل من سنة) قيد الإعداد وستُضاف قريبًا.':'يغطي التطبيق الأعمار حتى ١٢ سنة.'))+`<br><button class='back' id='delb' onclick='delKid()'>حذف ملف الطفل</button></div>`}
return `<h2>أطفالي</h2><div class='chips'>${chips}</div>${info}<details class='kf' ${k?'':'open'}><summary>${k?'＋ إضافة طفل':'أضف طفلك لتبدأ'}</summary><label>الاسم الأول<input id='kn' maxlength='20' autocomplete='off'></label><label>تاريخ الميلاد<input id='kd' type='date'></label><button class='go' onclick='addKid()'>حفظ</button><p id='km' class='note'></p><p class='note'>تُحفظ هذه البيانات على جهازك فقط ولا تُرسل لأي جهة.</p></details>`}
function todayUI(){
const k=curKid();if(!k)return '';
const s=stageOf(ageOf(k.dob));if(s<0)return '';
const items=D.us[s].secs[2][2],n=items.length,day=Math.floor(Date.now()/864e5),ids=[0,1,2].map(i=>(day*3+i)%n);
const dn=S.done[k.id+'|'+dk()]||[],c=ids.filter(i=>dn.includes(i)).length;
return `<h2>مهام اليوم</h2><div class='tk'><div class='bar'><i style='width:${Math.round(c/3*100)}%'></i></div><p class='note'>أنجزت ${AR(c)} من ٣</p>${ids.map(i=>`<label class='ck'><input type='checkbox' data-i='${i}' ${dn.includes(i)?'checked':''} onchange='tick(this)'><span>${items[i]}</span></label>`).join('')}</div>`}
function tick(el){const k=curKid();if(!k)return;const key=k.id+'|'+dk(),i=+el.dataset.i,a=S.done[key]||[];S.done[key]=a.includes(i)?a.filter(x=>x!=i):a.concat(i);save();$('#td').innerHTML=todayUI()}
function addKid(){const n=$('#kn').value.trim(),d=$('#kd').value,t=new Date(d),m=$('#km');
if(!n||!d){m.textContent='اكتب الاسم وتاريخ الميلاد.';return}
if(isNaN(t)||t>new Date()){m.textContent='تاريخ الميلاد غير صحيح.';return}
const id=Date.now().toString(36);S.kids.push({id:id,name:n,dob:d});S.cur=id;save();home()}
function pick(id){S.cur=id;save();home()}
function delKid(){const b=$('#delb');if(!window.dq){window.dq=1;b.textContent='اضغط مرة أخرى لتأكيد الحذف';return}
window.dq=0;S.kids=S.kids.filter(x=>x.id!=S.cur);S.cur=S.kids.length?S.kids[0].id:null;save();home()}
const nz=t=>t.replace(/[\u064B-\u0652\u0670]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
let IX=null;
function mkIx(){const r=[];D.us.forEach((u,s)=>{u.secs.forEach(sc=>sc[2].forEach(t=>r.push({s:s,k:sc[1],t:t})));u.probs.forEach((p,i)=>r.push({s:s,p:i,k:'مشكلة: '+p[0],t:p[0]+' '+p[1].join(' ')}))});return r}
function srch(v){const o=$('#sr');v=nz(v.trim());if(v.length<2){o.innerHTML='';return}IX=IX||mkIx();
const h=IX.filter(x=>nz(x.k+' '+x.t).includes(v)).slice(0,12);
o.innerHTML=h.length?h.map(x=>`<button class='res' data-s='${x.s}' data-p='${x.p===undefined?'':x.p}' onclick='goRes(this)'><small>${D.stages[x.s][1]} · ${x.k}</small><br>${x.t.slice(0,90)}</button>`).join(''):'<p class=note>لا نتائج. جرّب كلمة أخرى.</p>'}
function goRes(b){stage(+b.dataset.s);if(b.dataset.p!=='')prob(+b.dataset.p)}
function fv(k){S.fav=S.fav.includes(k)?S.fav.filter(x=>x!=k):S.fav.concat(k);save();prob(+k.split('|')[1])}
function openFav(k){const a=k.split('|').map(Number);stage(a[0]);prob(a[1])}
function toolsUI(){
const f=S.fav.filter(k=>{const a=k.split('|').map(Number);return D.us[a[0]]&&D.us[a[0]].probs[a[1]]}).map(k=>{const a=k.split('|').map(Number);return `<button class='chip' data-k='${k}' onclick='openFav(this.dataset.k)'>★ ${D.us[a[0]].probs[a[1]][0]} (${D.stages[a[0]][0]})</button>`}).join('');
return `<h2>أدوات سريعة</h2><button class='st' onclick='calm()'><span class='n'>🧘</span><span><b>أنا غاضب الآن</b><small>دقيقة لتهدأ قبل أن تتصرف</small></span></button><input id='q' class='qs' placeholder='ابحث: العناد، النوم، الشاشات…' oninput='srch(this.value)'><div id='sr'></div>${f?`<h2>المفضلة</h2><div class='chips'>${f}</div>`:''}`}
function calm(){app.innerHTML=`<button class='back' onclick='home()'>→ رجوع</button><h2 style='margin-top:4px'>أنا غاضب الآن</h2><p class='why'>الغضب شعور طبيعي، والمهم ما تفعله بعده. هدوؤك هو أول ما يحتاجه طفلك ليهدأ.</p><div class='br'></div><p class='note' style='text-align:center'>شهيق ٤ ثوانٍ، ثم زفير ٦ ثوانٍ. كرّر ٥ مرات.</p><div class='plan'><ol><li>توقّف قبل أي تصرف، وابتعد خطوة إن أمكن.</li><li>تأكد أن طفلك في مكان آمن، وقل له: «أحتاج دقيقة لأهدأ».</li><li>تنفّس ببطء كما في الدائرة.</li><li>ذكّر نفسك: سلوكه ليس هجومًا عليك، ودماغه ما زال ينضج.</li><li>عُد حين تهدأ، وتحدّثا عمّا حدث.</li></ol></div><div class='warn'><b>إن شعرت أنك قد تؤذي طفلك</b><ul><li>ضعه في مكان آمن (سريره إن كان رضيعًا) وابتعد.</li><li>لا تهزّ الرضيع أبدًا مهما بكى.</li><li>اتصل بشخص قريب تثق به ليساعدك، أو بخدمات الطوارئ إن كان هناك خطر.</li></ul></div>`;scrollTo(0,0)}
home();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
